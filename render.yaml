services:
  - type: web
    name: sankara-eye-api
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter @workspace/api-server build
    startCommand: node --enable-source-maps ./artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
